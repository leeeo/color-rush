# Android 릴리즈 빌드 자동화
#
# 트리거: v로 시작하는 태그 push (예: v1.0.0) 또는 수동 실행
# 결과물: 서명된 AAB(스토어 업로드용) + APK(직접 설치 테스트용) 아티팩트
#
# ★ 사전 준비 (docs/09-CI-CD-자동화.md 참고):
#   GitHub 저장소 Settings > Secrets and variables > Actions 에 등록:
#   - KEYSTORE_BASE64  : upload-keystore.jks 파일을 base64 인코딩한 문자열
#   - STORE_PASSWORD   : 키스토어 비밀번호
#   - KEY_PASSWORD     : 키 비밀번호
#   - KEY_ALIAS        : 키 별칭 (보통 upload)
name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: 서명 키 복원 (Secrets -> 파일)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      - name: AAB 빌드 (Play 스토어 업로드용)
        run: flutter build appbundle --release

      - name: APK 빌드 (직접 설치 테스트용)
        run: flutter build apk --release

      - name: AAB 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: colorrush-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: colorrush-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # ─────────────────────────────────────────────────────────────
      # (선택) Play 스토어 자동 업로드 - "첫 출시를 수동으로 완료한 후"에만
      # 사용 가능합니다. 사용하려면 docs/09-CI-CD-자동화.md 6장을 따라
      # 서비스 계정을 만들고 PLAY_SERVICE_ACCOUNT_JSON 시크릿을 등록한 뒤
      # 아래 주석을 해제하세요.
