# 코드 품질 자동 검사: push/PR 마다 정적분석 + 테스트 실행
name: CI

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/ci.yml']

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6 # 로컬 개발 버전과 동일하게 고정
          cache: true

      - name: Flutter 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트 실행
        run: flutter test
